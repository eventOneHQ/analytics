openapi: 3.0.0
info:
  title: Analytics
  description: A simple analytics API.
  version: 0.0.0
servers:
  - url: https://e1-analytics.herokuapp.com/1.0
  - url: http://localhost:3000/1.0
tags:
  - name: Events
    description: Events are the individual data points collected by the API. These events are stored in collections.
  - name: Projects
    description: Projects
  - name: Queries
    description: Keen.io-compatible analytics queries
  - name: Collections
    description: Event collection management
components:
  securitySchemes:
    RootKey:
      type: apiKey
      in: header
      name: X-Root-Key
      description: The instance root key is used for managing projects.
    WriteKeyHeader:
      type: apiKey
      in: header
      name: Authorization
    WriteKeyQuery:
      type: apiKey
      in: query
      name: api_key
    ReadKeyHeader:
      type: apiKey
      in: header
      name: Authorization
    ReadKeyQuery:
      type: apiKey
      in: query
      name: api_key

  schemas:
    CreateProjectScema:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Specifies the name of the project
          example: 'Test Project'
    ProjectScema:
      type: object
      required:
        - name
      properties:
        _id:
          type: string
          example: 5e19426836270c1b1e7b03f2
        name:
          type: string
          description: Specifies the name of the project
          example: 'Test Project'
        masterKey:
          type: string
          example: <MASTER_API_KEY>
        readKey:
          type: string
          example: <READ_API_KEY>
        writeKey:
          type: string
          example: <WRITE_API_KEY>
        createdAt:
          type: string
          example: '2020-01-11T13:38:05.006Z'
        updatedAt:
          type: string
          example: '2020-01-11T21:18:56.035Z'
    QuerySchema:
      type: object
      required:
        - analysis_type
        - event_collection
      properties:
        analysis_type:
          type: string
          enum: [count, count_unique, sum, average, minimum, maximum, median, percentile, select_unique, extraction]
        event_collection:
          type: string
          example: page_views
        target_property:
          type: string
          example: revenue
        percentile:
          type: number
          example: 95
        timeframe:
          oneOf:
            - type: string
              example: this_14_days
            - type: object
              properties:
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
        interval:
          type: string
          enum: [minutely, hourly, daily, weekly, monthly, yearly]
        filters:
          type: array
          items:
            type: object
        group_by:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        limit:
          type: integer
    QueryResultSchema:
      type: object
      properties:
        result:
          oneOf:
            - type: number
            - type: array
              items:
                type: object
    CollectionSchema:
      type: object
      properties:
        name:
          type: string
        eventCount:
          type: number
        properties:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string

  responses:
    BadRequestError:
      description: Missing or invalid parameters. Error messages will often contain more information to help you figure out what’s wrong.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'Failed to parse data.'
              error_code:
                type: string
                default: BadRequestError
    UnauthorizedError:
      description: API key is missing or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'The API Key is invalid.'
              error_code:
                type: string
                default: UnauthorizedError
    NotFoundError:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'Resource not found.'
              error_code:
                type: string
                default: NotFoundError
    EventCreated:
      description: Event created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              created:
                type: boolean
                default: true
    Project:
      description: A project object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectScema'
    Projects:
      description: A project object
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ProjectScema'
  parameters:
    ProjectIdParam:
      in: path
      name: projectId
      schema:
        type: string
        example: 5e19426836270c1b1e7b03f2
      required: true
      description: ID of the project.
    CollectionNameParam:
      in: path
      name: collectionName
      schema:
        type: string
        example: your_event
      required: true
      description: Name of the event collection to record the event in.

paths:
  /projects/{projectId}/events/{collectionName}:
    post:
      summary: Record a single event
      security:
        - WriteKeyHeader: []
        - WriteKeyQuery: []
      tags:
        - Events
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/CollectionNameParam'
      responses:
        '201':
          $ref: '#/components/responses/EventCreated'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
      requestBody:
        description: Key value object of the event body
        required: false
        content:
          application/json:
            schema:
              type: object
              default: {}
              example: { key: 'value' }

    get:
      summary: Record a single event
      security:
        - WriteKeyHeader: []
        - WriteKeyQuery: []
      tags:
        - Events
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/CollectionNameParam'
        - in: query
          name: data
          schema:
            type: string
          description: URL-encoded AND base-64 encoded event body
        - in: query
          name: redirect
          schema:
            type: string
          description: A URL to redirect the request toward after the event is recorded.
      responses:
        '201':
          $ref: '#/components/responses/EventCreated'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /projects:
    get:
      summary: Get projects
      security:
        - RootKey: []
      tags:
        - Projects
      responses:
        '200':
          $ref: '#/components/responses/Projects'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create project
      security:
        - RootKey: []
      tags:
        - Projects
      requestBody:
        description: New project
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectScema'
      responses:
        '200':
          $ref: '#/components/responses/Project'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /projects/{projectId}:
    get:
      summary: Get project
      security:
        - RootKey: []
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '200':
          $ref: '#/components/responses/Project'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      summary: Update project
      security:
        - RootKey: []
      tags:
        - Projects
      requestBody:
        description: Updated project
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectScema'
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '200':
          $ref: '#/components/responses/Project'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /projects/{projectId}/queries/run:
    post:
      summary: Run a Keen-compatible query
      security:
        - ReadKeyHeader: []
        - ReadKeyQuery: []
      tags:
        - Queries
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuerySchema'
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResultSchema'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    get:
      summary: Run a Keen-compatible query (GET)
      security:
        - ReadKeyHeader: []
        - ReadKeyQuery: []
      tags:
        - Queries
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - in: query
          name: query
          schema:
            type: string
          description: JSON-encoded IQuery object
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResultSchema'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /projects/{projectId}/collections:
    get:
      summary: List all collections for a project
      security:
        - ReadKeyHeader: []
        - ReadKeyQuery: []
      tags:
        - Collections
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
      responses:
        '200':
          description: Array of collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionSchema'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /projects/{projectId}/collections/{collectionName}/properties:
    get:
      summary: Get property names and types for a collection
      security:
        - ReadKeyHeader: []
        - ReadKeyQuery: []
      tags:
        - Collections
      parameters:
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/CollectionNameParam'
      responses:
        '200':
          description: Collection properties
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  properties:
                    type: object
                    additionalProperties:
                      type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
